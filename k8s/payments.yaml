# Demo workloads for the payment-api story.
# All three run in namespace "payments" on the same node.
#
# payment-api deliberately has NO memory limit and leaks memory up to
# LEAK_CAP_MB, then logs a blocked worker - the "hung process". The cap keeps
# a small node safe; the alert payloads carry the production-scale numbers.
apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-api-app
  namespace: payments
data:
  app.py: |
    import os, time
    cap = int(os.environ.get("LEAK_CAP_MB", "300"))
    step = int(os.environ.get("LEAK_STEP_MB", "5"))
    interval = int(os.environ.get("LEAK_INTERVAL_S", "10"))
    held = []
    print("payment-api v2.14.0 starting (iso8583-codec 4.0.0)", flush=True)
    while True:
        if len(held) * step < cap:
            held.append(b"x" * (step << 20))   # pooled message buffers never released
            print(f"authorised batch; codec buffer pool {len(held) * step}MB", flush=True)
        else:
            print("WARN authorisation worker blocked: heartbeat missed, 0 authorisations acked", flush=True)
        time.sleep(interval)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payments
  labels: { app: payment-api }
  annotations:
    app.example-payments/version: v2.14.0
    app.example-payments/change: "iso8583-codec 3.4.2 -> 4.0.0"
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-api }
  template:
    metadata:
      labels: { app: payment-api, version: v2.14.0 }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "/app/app.py"]
          env:
            - { name: LEAK_CAP_MB, value: "300" }
          volumeMounts:
            - { name: app, mountPath: /app }
          # No resources block: this is the bug the remediation fixes.
      volumes:
        - name: app
          configMap: { name: payment-api-app }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-portal
  namespace: payments
  labels: { app: payments-portal }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payments-portal }
  template:
    metadata:
      labels: { app: payments-portal }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: payments
  labels: { app: checkout }
spec:
  replicas: 1
  selector:
    matchLabels: { app: checkout }
  template:
    metadata:
      labels: { app: checkout }
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
